name: CI - Evidencias de testes

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reflex:
    name: Reflex - testes locais e E2E publico
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: frontend/requirements.txt
      - name: Instalar dependencias
        run: python -m pip install -r frontend/requirements.txt pytest==8.4.2 pytest-playwright==0.10.0 playwright==1.65.0
      - name: Verificar gerador de evidencias
        run: |
          mkdir -p test-evidence/reflex
          python -m pytest -q tests/test_evidence_runner.py tests/test_roteiros_sprint5.py --junitxml=test-evidence/reflex/gerador.xml
      - name: Executar testes locais Reflex
        if: always()
        run: python scripts/run_test_evidence.py --suite reflex --output test-evidence/reflex --require-execution
      - name: Instalar Chromium
        if: always()
        run: python -m playwright install --with-deps chromium
      - name: Iniciar Reflex e executar E2E publico
        if: always()
        run: python scripts/run_reflex_e2e_ci.py
      - name: Guardar evidencias Reflex mesmo se falhar
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencias-reflex
          path: test-evidence/reflex/
          if-no-files-found: warn
      - name: Guardar evidencias E2E mesmo se falhar
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencias-e2e
          path: test-evidence/e2e/
          if-no-files-found: warn

  xano:
    name: Xano - funcoes puras
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: frontend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Instalar dependencias Python
        run: python -m pip install -r frontend/requirements.txt pytest==8.4.2
      - name: Instalar CLI oficial Xano
        run: npm install -g @xano/cli@1.3.4
      - name: Executar testes Xano sem escrita
        if: always()
        env:
          XANO_CLI_CONFIG_YAML: ${{ secrets.XANO_CLI_CONFIG_YAML }}
          XANO_TEST_PROFILE: ${{ vars.XANO_TEST_PROFILE || 'ps-impacta' }}
        run: python scripts/run_test_evidence.py --suite xano-safe --output test-evidence/xano-safe --require-execution
      - name: Guardar evidencias Xano mesmo se falhar
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencias-xano
          path: test-evidence/xano-safe/
          if-no-files-found: warn

  consolidado:
    name: Consolidar evidencias
    needs: [reflex, xano]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: evidencias-reflex
          path: test-evidence/entrada-reflex
      - uses: actions/download-artifact@v4
        with:
          name: evidencias-e2e
          path: test-evidence/entrada-e2e
      - uses: actions/download-artifact@v4
        with:
          name: evidencias-xano
          path: test-evidence/entrada-xano
      - name: Consolidar XML JSON e Markdown
        run: >-
          python scripts/merge_test_evidence.py
          --input test-evidence/entrada-reflex
          --input test-evidence/entrada-e2e
          --input test-evidence/entrada-xano
          --output test-evidence/consolidado
      - name: Guardar consolidado mesmo se falhar
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencias-consolidadas
          path: test-evidence/consolidado/
          if-no-files-found: warn
