schema: spec-driven

context: |
  - Project: Sistema acadêmico de Fila Prioritária para Pronto-Socorro. Perfis: Recepção/Triagem,
    Médico e Administrador; Totem no escopo, com change funcional própria. Ver, nesta ordem,
    docs/project-overview.md, docs/domain-model.md, este resumo e as specs/changes existentes.
  - Tech stack: Frontend Reflex (Python); backend e banco Xano (XanoScript). Regras,
    persistência e autorização ficam no Xano; Reflex apresenta e envia dados.
  - Domain invariants: escore clínico = pontos de todos os sintomas + pontos dos sinais vitais;
    a especialidade do Médico é cadastral e não restringe atendimento; chamadas da mesma
    senha a cada 30 segundos, até 3 tentativas por oportunidade e uma única reentrada ao fim
    da fila; fuso fixo America/Sao_Paulo.
  - Security: Autorização por perfil é validada no backend. Painel público nunca exibe CPF nem
    nome completo. Alterações relevantes geram auditoria.
  - Development: Mudanças especificadas com OpenSpec e entregues em fatias verticais verificáveis.
    Quando uma change existente conflitar com a base sanitizada, revisar a change antes de
    implementá-la. Confluence é a referência formal de RF/RNF/RN e deve permanecer sincronizado.
  - Language: Escrever artefatos OpenSpec e documentação inteiramente em português
    brasileiro, inclusive títulos, "DEVE"/"NÃO DEVE" nos requisitos e "QUANDO"/"ENTÃO"/"E"
    nos cenários. Exceção obrigatória (o CLI do OpenSpec depende deles): manter em inglês
    apenas os marcadores "## Why", "## What Changes" (proposal.md), "## Purpose",
    "## ADDED/MODIFIED/REMOVED/RENAMED Requirements", "### Requirement:" e "#### Scenario:".

rules:
  proposal:
    - Descrever claramente problema, objetivo e escopo, citando RF/RN do documento formal quando aplicável.
    - Começar com o cabeçalho (change, sprint, fatias no Trello, dupla, depende de, situação) e terminar com "Perguntas em aberto".
    - Usar os títulos "## Why" e "## What Changes"; sem eles o comando openspec show não lê o proposal.
    - Listar explicitamente o que fica fora do escopo da change.
  specs:
    - Escrever requisitos verificáveis, com cenários para casos de erro e de permissão negada.
  tasks:
    - Dividir em tarefas pequenas e verificáveis, separando Xano (backend) e Reflex (frontend).

operations:
  apply:
    guidance:
      - Executar as verificações definidas nas tasks antes de marcá-las como concluídas.
  archive:
    guidance:
      - Confirmar que a implementação corresponde à spec e que docs/domain-model.md está atualizado.
